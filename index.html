<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades JavaScript</title>
</head>
<body>

    <h1>Atividades de JavaScript</h1>

    <h2>1. Classificação de idade</h2>

    <input type="number" id="idade" placeholder="Digite sua idade">
    <button id="btnIdade">Verificar</button>

    <p id="resultadoIdade"></p>


    <h2>2. Situação do aluno</h2>

    <input type="number" id="nota1" placeholder="Primeira nota">
    <input type="number" id="nota2" placeholder="Segunda nota">

    <button id="btnNotas">Calcular média</button>

    <p id="resultadoNotas"></p>


    <h2>3. Positivo, negativo ou zero</h2>

    <input type="number" id="numero" placeholder="Digite um número">

    <button id="btnNumero">Verificar número</button>

    <p id="resultadoNumero"></p>


    <h2>4. Sistema de acesso</h2>

    <input type="number" id="idadeAcesso" placeholder="Digite sua idade">
    <input type="password" id="senhaAcesso" placeholder="Digite sua senha">

    <button id="btnAcesso">Verificar acesso</button>

    <p id="resultadoAcesso"></p>


    <h2>5. Desconto da loja</h2>

    <input type="number" id="valorCompra" placeholder="Valor da compra">

    <select id="tipoCliente">
        <option value="comum">Cliente comum</option>
        <option value="vip">Cliente VIP</option>
    </select>

    <button id="btnDesconto">Calcular desconto</button>

    <p id="resultadoDesconto"></p>


    <h2>6. Classificação do jogador</h2>

    <input type="number" id="pontos" placeholder="Digite os pontos">

    <button id="btnPontos">Classificar</button>

    <p id="resultadoPontos"></p>


    <h2>7. Empréstimo bancário</h2>

    <input type="number" id="salario" placeholder="Salário">
    <input type="number" id="prestacao" placeholder="Prestação">

    <button id="btnEmprestimo">Verificar empréstimo</button>

    <p id="resultadoEmprestimo"></p>


    <h2>Desafio Integrador - Cinema</h2>

    <input type="number" id="idadeCinema" placeholder="Idade">

    <select id="responsavel">
        <option value="nao">Não está acompanhado</option>
        <option value="sim">Está acompanhado</option>
    </select>

    <select id="estudante">
        <option value="nao">Não é estudante</option>
        <option value="sim">É estudante</option>
    </select>

    <button id="btnCinema">Verificar entrada</button>

    <p id="resultadoCinema"></p>


    <script src="script1.js"></script>

</body>
</html>
